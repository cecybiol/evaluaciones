<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Conector ATX de 24 pines (vista frontal)</text>

  <!-- Fila superior: pines 1-12 -->
  <g id="fila1">
    <!-- pin,color,label -->
  </g>

  <!-- Se generan 24 celdas: 12 arriba, 12 abajo -->
  <!-- Coordenadas base -->
  <!-- Fila 1: y=70, Fila 2: y=170 -->

  <!-- Pin data as rects -->
  <!-- 1 Orange -->
  <g>
    <rect x="40" y="70" width="60" height="60" fill="#ff8c1a" stroke="#333"/>
    <text x="70" y="100" text-anchor="middle" font-size="14" fill="#000">1</text>
    <text x="70" y="150" text-anchor="middle" font-size="11" fill="#333">+3.3V</text>
  </g>
  <!-- 2 Orange -->
  <g>
    <rect x="105" y="70" width="60" height="60" fill="#ff8c1a" stroke="#333"/>
