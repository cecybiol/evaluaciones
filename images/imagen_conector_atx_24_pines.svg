    <rect x="430" y="180" width="60" height="60" fill="#222222" stroke="#333"/>
    <text x="460" y="210" text-anchor="middle" font-size="14" fill="#fff">19</text>
    <text x="460" y="260" text-anchor="middle" font-size="11" fill="#333">GND</text>
