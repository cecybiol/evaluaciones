    <rect x="560" y="180" width="60" height="60" fill="#e11d1d" stroke="#333"/>
    <text x="590" y="210" text-anchor="middle" font-size="14" fill="#fff">21</text>
    <text x="590" y="260" text-anchor="middle" font-size="11" fill="#333">+5V</text>
  </g>
  <!-- 22 Red -->
  <g>
    <rect x="625" y="180" width="60" height="60" fill="#e11d1d" stroke="#333"/>
    <text x="655" y="210" text-anchor="middle" font-size="14" fill="#fff">22</text>
